# horalix.com is served by the horalix-com Cloudflare Worker this repository builds.
# Cloudflare, which runs horalix.com's DNS, still hands its traffic to this Netlify project,
# so Netlify proxies every request to the Worker. The X-Horalix-Proxy header tells the
# Worker to answer as horalix.com (worker/index.ts). Once horalix.com is routed to the
# Worker in Cloudflare directly, disconnect Netlify and delete this file.

[build]
  command = "mkdir -p .netlify-proxy && echo 'horalix.com is served by the horalix-com Worker.' > .netlify-proxy/index.html"
  publish = ".netlify-proxy"

[[redirects]]
  from = "/*"
  to = "https://horalix-com.server-9de.workers.dev/:splat"
  status = 200
  force = true
  headers = {X-Horalix-Proxy = "netlify"}
